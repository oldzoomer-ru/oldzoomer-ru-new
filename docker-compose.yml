services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oldzoomer-app
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - GH_TOKEN=${GH_TOKEN}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
